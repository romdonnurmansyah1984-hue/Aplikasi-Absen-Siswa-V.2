<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Inner Ring -->
  <rect x="44" y="44" width="424" height="424" rx="76" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Education Emblem: Open Book & Graduation Cap & Checkmark -->
  <g transform="translate(256, 230)">
    <!-- Graduation Cap -->
    <path d="M 0 -95 L 90 -55 L 0 -15 L -90 -55 Z" fill="#ffffff" />
    <path d="M 0 -15 L 70 -45 L 70 -15 Q 0 45 -70 -15 L -70 -45 Z" fill="#e2e8f0" opacity="0.9" />
    <path d="M 75 -45 L 85 10 C 85 25 80 40 75 45" stroke="#f59e0b" stroke-width="5" fill="none" stroke-linecap="round" />
    <circle cx="75" cy="48" r="7" fill="#f59e0b" />

    <!-- Open Book -->
    <path d="M -110 30 Q -40 20 0 45 Q 40 20 110 30 L 110 85 Q 40 75 0 100 Q -40 75 -110 85 Z" fill="#ffffff" />
    <path d="M 0 45 L 0 100" stroke="#0284c7" stroke-width="4" />

    <!-- Checkmark Badge for Attendance -->
    <circle cx="85" cy="85" r="42" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" filter="url(#shadow)" />
    <path d="M 70 86 L 80 96 L 102 74" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text / Banner -->
  <text x="256" y="415" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">SDN 3 GODOG</text>
  <text x="256" y="445" font-family="Arial, sans-serif" font-weight="600" font-size="19" fill="#93c5fd" text-anchor="middle" letter-spacing="4">ABSENSI DIGITAL</text>
</svg>
